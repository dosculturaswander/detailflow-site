name: Publish DCW hospitality photo gallery
on:
  push:
    branches: [dcw-cinematic-portfolio]
    paths:
      - dcw-hospitality-photos.html
      - dcw-hospitality-photos.css
      - dcw-hospitality-photos.js
      - .github/scripts/apply_dcw_hospitality_photos.py
      - .github/workflows/update-dcw-hospitality-photos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-photo-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dcw-cinematic-portfolio
          persist-credentials: true
      - name: Update photo collection
        run: python3 .github/scripts/apply_dcw_hospitality_photos.py
      - name: Commit updated homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish Hospitality Photos collection"
            git push origin HEAD:dcw-cinematic-portfolio
          fi
