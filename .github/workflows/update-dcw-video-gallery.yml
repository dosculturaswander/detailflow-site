name: Update hospitality video categories
on:
  push:
    branches: [dcw-cinematic-portfolio]
    paths:
      - dcw-video-gallery.html
      - dcw-video-gallery.css
      - dcw-video-gallery.js
      - .github/scripts/apply_dcw_video_gallery.py
      - .github/workflows/update-dcw-video-gallery.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-video-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dcw-cinematic-portfolio
          persist-credentials: true
      - name: Update portfolio video gallery
        run: python3 .github/scripts/apply_dcw_video_gallery.py
      - name: Publish HTML changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish Montage and UGC Style galleries"
            git push origin HEAD:dcw-cinematic-portfolio
          fi

